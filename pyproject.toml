[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dftagent-search"
version = "0.1.0"
description = "LLM basin-agent and diverse-BO search for XC functionals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.24",
  "numpy>=1.24",
  "openai>=1.0",
  "optuna>=3.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
chemistry = [
  "pyscf>=2.7",
  "scipy>=1.10",
]
test = [
  "pytest>=7.0",
  "pytest-timeout>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
