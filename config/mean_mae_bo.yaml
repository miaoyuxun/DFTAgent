output_dir: results/mean_mae_bo
core_output_dir: results/mean_mae_bo_core
log_level: INFO

search:
  cycles: 1
  proposals_per_cycle: 24
  proposal_batch_size: 4
  max_proposal_batches: 12
  proposal_evaluation_concurrency: 4
  parent_pool_size: 12
  parent_pool_max_per_seed: 4
  novelty_threshold: 0.0
  component_pool: expanded
  update_functional_graph: false
  enable_local_ea: false
  ea_seed_count: 0
  allow_hf_exchange_rewire: true
  allow_ext_param_rewire: false
  use_benchmark_component_priors: false
  candidate_pool_size: 128
  diversity_weight: 0.0
  uncertainty_weight: 0.25
  kernel_scale: 0.35
  max_structure_edits: 1
  single_step_proposals: true
  single_step_parameter_sigma_fraction: 0.12
  single_step_mixing_transfer: 0.10
  seed: 42

task:
  component_pool: expanded
  root_functional: PBE0
  root_evaluation_path: examples/root_evaluation.example.json
  subsets: [ALKBDE10, DIPCS10, G2RC]
  max_failures_per_subset: 0
  allow_hf_exchange: true
  allow_ext_param_rewire: false

evaluation:
  backend: vc
  vc_prefix: $DFTAGENT_VC_PREFIX
  container_repo_root: /workspace/DFTAgent
  cpus_per_candidate: 4
  max_concurrent: 4

benchmark_evaluation:
  gmtkn55_dir: benchmark/GMTKN55
  basis: def2-TZVP
  scf_max_cycle: 200
  scf_conv_tol: 1.0e-8
  aggregate_mode: reaction_mean
  n_workers: 4
  n_threads: 1
  molecules_per_task: 1
