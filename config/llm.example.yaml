llm:
  model: ${OPENAI_MODEL}
  api_key: ${OPENAI_API_KEY}
  # Set this explicitly when using an OpenAI-compatible endpoint.
  base_url:
  temperature: 0.2
  timeout_s: 300
  retry_attempts: 8
  retry_initial_delay_s: 5
  retry_max_delay_s: 60
  retry_backoff: 1.4
  retry_timeouts: true
  max_tokens: 4096
